# Choose a globally unique name and set SPRITE_CRON_ORIGIN to match.
app = "replace-with-your-sprite-cron-app"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRITE_CRON_DB = "/data/sprite-cron.db"
  SPRITE_CRON_LISTEN = ":8080"
  SPRITE_CRON_ORIGIN = "https://replace-with-your-sprite-cron-app.fly.dev"
  SPRITE_CRON_ACTIVE_KEY = "v1"
  SPRITE_CRON_DISPATCH_DISABLED = "false"

[[mounts]]
  source = "cron_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/readyz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
